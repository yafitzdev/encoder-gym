[workspace]
members = [
    "apps/generation-cli",
    "apps/generation-server",
    "crates/agent-runtime-core",
    "crates/analysis-core",
    "crates/advisor-fake",
    "crates/advisor-openai-compatible",
    "crates/artifact-core",
    "crates/benchmark-architect-core",
    "crates/benchmark-architect-runner",
    "crates/dataset-core",
    "crates/dataset-import",
    "crates/dataset-quality-core",
    "crates/dataset-quality-fake",
    "crates/dataset-quality-openai-compatible",
    "crates/dataset-quality-runner",
    "crates/dataset-architect-core",
    "crates/dataset-architect-runner",
    "crates/encoder-experiment-core",
    "crates/encoder-campaign-core",
    "crates/encoder-experiment-nomos",
    "crates/encoder-experiment-runner",
    "crates/encoder-experiment-sqlite",
    "crates/evaluation-core",
    "crates/generation-core",
    "crates/generation-fake",
    "crates/generation-openai-compatible",
    "crates/generation-supervisor-core",
    "crates/generation-supervisor-runner",
    "crates/optimization-core",
    "crates/project-config",
    "crates/project-preparation",
    "crates/research-core",
    "crates/research-web",
    "crates/research-agent-pi-process",
    "crates/research-runner",
    "crates/recovery-core",
    "crates/semantic-catalog",
    "crates/generation-sqlite",
    "crates/generation-test-support",
    "crates/training-core",
    "crates/training-linear",
    "crates/training-transformer",
    "crates/workflow-core",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
agent-runtime-core = { package = "agent-runtime-core", path = "crates/agent-runtime-core" }
anyhow = "1"
candle-core = { version = "0.11", default-features = false }
candle-nn = { version = "0.11", default-features = false }
candle-transformers = { version = "0.11", default-features = false }
sha2 = "0.10"
axum = { version = "0.8", features = ["http1", "json", "tokio"] }
clap = { version = "4.5", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
csv = "1"
dotenvy = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
safetensors = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["chrono", "json", "macros", "migrate", "runtime-tokio", "sqlite", "uuid"] }
sysinfo = "0.35"
tempfile = "3"
thiserror = "2"
toml = "0.9"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["serde", "v4"] }
url = "2"

generation-core = { package = "synthetic-data-core", path = "crates/generation-core" }
generation-fake = { package = "synthetic-data-fake", path = "crates/generation-fake" }
generation-supervisor-core = { package = "generation-supervisor-core", path = "crates/generation-supervisor-core" }
generation-supervisor-runner = { package = "generation-supervisor-runner", path = "crates/generation-supervisor-runner" }
dataset-core = { package = "dataset-core", path = "crates/dataset-core" }
dataset-import = { package = "dataset-import", path = "crates/dataset-import" }
dataset-quality-core = { package = "dataset-quality-core", path = "crates/dataset-quality-core" }
dataset-quality-fake = { package = "dataset-quality-fake", path = "crates/dataset-quality-fake" }
dataset-quality-openai-compatible = { package = "dataset-quality-openai-compatible", path = "crates/dataset-quality-openai-compatible" }
dataset-quality-runner = { package = "dataset-quality-runner", path = "crates/dataset-quality-runner" }
dataset-architect-core = { package = "dataset-architect-core", path = "crates/dataset-architect-core" }
dataset-architect-runner = { package = "dataset-architect-runner", path = "crates/dataset-architect-runner" }
training-core = { package = "training-core", path = "crates/training-core" }
evaluation-core = { package = "evaluation-core", path = "crates/evaluation-core" }
encoder-experiment-core = { package = "encoder-experiment-core", path = "crates/encoder-experiment-core" }
encoder-campaign-core = { package = "encoder-campaign-core", path = "crates/encoder-campaign-core" }
encoder-experiment-nomos = { package = "encoder-experiment-nomos", path = "crates/encoder-experiment-nomos" }
encoder-experiment-runner = { package = "encoder-experiment-runner", path = "crates/encoder-experiment-runner" }
encoder-experiment-sqlite = { package = "encoder-experiment-sqlite", path = "crates/encoder-experiment-sqlite" }
analysis-core = { package = "analysis-core", path = "crates/analysis-core" }
artifact-core = { package = "artifact-core", path = "crates/artifact-core" }
benchmark-architect-core = { package = "benchmark-architect-core", path = "crates/benchmark-architect-core" }
benchmark-architect-runner = { package = "benchmark-architect-runner", path = "crates/benchmark-architect-runner" }
optimization-core = { package = "optimization-core", path = "crates/optimization-core" }
project-config = { package = "project-config", path = "crates/project-config" }
project-preparation = { package = "project-preparation", path = "crates/project-preparation" }
research-core = { package = "research-core", path = "crates/research-core" }
research-web = { package = "research-web", path = "crates/research-web" }
research-agent-pi-process = { package = "research-agent-pi-process", path = "crates/research-agent-pi-process" }
research-runner = { package = "research-runner", path = "crates/research-runner" }
recovery-core = { package = "recovery-core", path = "crates/recovery-core" }
semantic-catalog = { package = "semantic-catalog", path = "crates/semantic-catalog" }
workflow-core = { package = "workflow-core", path = "crates/workflow-core" }
advisor-fake = { package = "advisor-fake", path = "crates/advisor-fake" }
advisor-openai-compatible = { package = "advisor-openai-compatible", path = "crates/advisor-openai-compatible" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
