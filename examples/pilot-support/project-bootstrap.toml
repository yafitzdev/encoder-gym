version = 1
name = "support-pilot"

[project]
version = 1

[project.dataset]
name = "support-pilot-training"
task = "Classify customer support requests"
labels = ["billing", "fraud", "account", "technical"]

[[project.dataset.dimensions]]
name = "difficulty"
values = ["easy", "hard"]

[[project.dataset.dimensions]]
name = "writing_style"
values = ["clean", "messy"]

[project.generation]
target_per_cell = 1
batch_size = 8
max_retries = 0
max_attempt_multiplier = 2
backend = "fake"
model = "deterministic-v1"
seed = 7

[project.snapshot]
name = "support-pilot-training"
train_ratio = 0.8
validation_ratio = 0.0
test_ratio = 0.2
seed = 7

[project.training]
backend = "hashing-linear"
feature_dimension = 64
epochs = 1
learning_rate = 0.1
l2 = 0.0
checkpoint_every = 1
seed = 7
artifact_root = "artifacts/pilot-support"

[project.evaluation]
split = "test"
batch_size = 16
top_k = [1]
calibration_bins = 5
minimum_slice_support = 1
bootstrap_samples = 100
statistical_seed = 7
confidence_level = 0.95
dimension_intersections = [["difficulty", "writing_style"]]

[development]
name = "support-pilot-development"
required_model_formats = []

[[development.cohorts]]
name = "development-local"
origin = "internal_snapshot"
role = "development"
disclosure = "row_content"
adaptation_eligible = true

[development.cohorts.source]
path = "development.jsonl"
format = "jsonl"
text_field = "text"
label_field = "label"

[development.cohorts.source.dimensions]
difficulty = "dimensions.difficulty"
writing_style = "dimensions.writing_style"

[development.contract]

[[development.contract.metric_requirements]]
target = { kind = "overall" }
metric = "macro_f1"
minimum = 0.01
minimum_support = 1

[sealed]
name = "support-pilot-sealed"
required_model_formats = []

[[sealed.cohorts]]
name = "sealed-local"
origin = "internal_snapshot"
role = "sealed_acceptance"
disclosure = "aggregate"
adaptation_eligible = false

[sealed.cohorts.source]
path = "sealed.csv"
format = "csv"
text_field = "text"
label_field = "label"

[sealed.cohorts.source.dimensions]
difficulty = "difficulty"
writing_style = "writing_style"

[sealed.contract]

[[sealed.contract.metric_requirements]]
target = { kind = "overall" }
metric = "macro_f1"
minimum = 0.01
minimum_support = 1

[workflow]
name = "support-pilot-workflow"
total_rows = 20
reserved_rows = 4

[workflow.allocation_policy]
kind = "balanced"

[workflow.governance]
mode = "review_each_iteration"

[workflow.budget]
maximum_iterations = 1
maximum_initial_rows = 20
maximum_cumulative_rows = 24
maximum_generation_attempts = 128
maximum_generation_requests = 64
maximum_advisor_calls = 0
maximum_stage_attempts = 2

[workflow.policy]
minimum_improvement = 0.01
maximum_tolerated_regression = 0.01
stop_on_inconclusive = true
stop_on_invalid = true
enable_advisor = false
