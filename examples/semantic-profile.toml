schema_version = 1
key = "support-difficulty"
description = "Difficulty is inference burden, not vocabulary rarity."

[scope]
kind = "reusable"

[target]
kind = "dimension"
name = "difficulty"

[entries.easy]
description = "The user's intent is stated directly."
examples = ["Why was I charged twice?"]
inclusion_rules = ["One explicit clue is sufficient to choose the label."]

[entries.hard]
description = "The label must be inferred from multiple indirect clues."
counterexamples = ["Rare vocabulary alone does not make an example hard."]
exclusion_rules = ["Do not state the category with a direct label synonym."]
