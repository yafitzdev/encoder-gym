version = 1

[dataset]
name = "support-intents"
task = "Classify a customer support message by its primary intent."
labels = ["billing", "fraud", "account", "technical"]

[generation]
backend = "fake"
model = "deterministic-v1"

[snapshot]
name = "baseline-v1"
train_ratio = 0.8
validation_ratio = 0.1
test_ratio = 0.1
seed = 42

[training]
backend = "bert-cpu"
# Replace this with the ID returned by `synth encoder register`.
base_model_id = "00000000-0000-0000-0000-000000000001"
epochs = 3
learning_rate = 0.00002
checkpoint_every = 1
seed = 42
artifact_root = "artifacts/training"

[training.transformer]
maximum_sequence_length = 128
batch_size = 8
weight_decay = 0.01
warmup_ratio = 0.1
gradient_clip_norm = 1.0
mode = "fine-tune"

[evaluation]
split = "test"
batch_size = 32
top_k = [1]
calibration_bins = 10
minimum_slice_support = 1
bootstrap_samples = 1000
statistical_seed = 42
confidence_level = 0.95
