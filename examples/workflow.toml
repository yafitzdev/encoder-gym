# Replace every placeholder identity with values returned by config init,
# benchmark create, and benchmark show before running `workflow define`.
name = "bounded encoder loop"
dataset_id = "00000000-0000-0000-0000-000000000000"
project_configuration_id = "00000000-0000-0000-0000-000000000000"
project_configuration_fingerprint = "sha256:replace-project-configuration"
development_suite_id = "00000000-0000-0000-0000-000000000000"
development_suite_fingerprint = "sha256:replace-development-suite"
sealed_suite_id = "00000000-0000-0000-0000-000000000000"
sealed_suite_fingerprint = "sha256:replace-sealed-suite"
training_iteration_policy = "fresh"

# Optional immutable pre-training quality gate. Omit this entire table to keep
# the legacy generation -> snapshot workflow. Governed workflows accept only
# the deterministic local evaluator in V1; use the standalone quality CLI for
# external evaluator backends.
[quality_gate]
preset = "fast"
egress_policy = "local_only"
authenticity = "off"
evaluator_backend = "deterministic-fake"
evaluator_protocol_version = "quality-evaluator-v1"

[initial_allocation]
total_rows = 20000
reserved_rows = 2000
constraints = []

[initial_allocation.policy]
kind = "balanced"

[advisor]
backend = "fake"
model = "deterministic-v1"
api_key_env = "SYNTH_ADVISOR_API_KEY"
egress_policy = "aggregate_only"
maximum_findings = 20
maximum_representative_errors = 0
maximum_actions = 5
maximum_output_tokens = 1000
temperature = 0.0

[governance]
mode = "review_each_iteration"

[budget]
maximum_iterations = 3
maximum_initial_rows = 20000
maximum_cumulative_rows = 24000
maximum_generation_attempts = 60000
maximum_generation_requests = 6000
maximum_advisor_calls = 3
maximum_advisor_tokens = 10000
maximum_stage_attempts = 3

[policy]
minimum_improvement = 0.005
maximum_tolerated_regression = 0.01
stop_on_inconclusive = true
stop_on_invalid = true
enable_advisor = true
require_fresh_development_cohort_after_iterations = 2
